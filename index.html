<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>convenienceIA - Super-app RD</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 450px; text-align: center; }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; }
        .btn { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
        .status { margin-top: 15px; font-size: 13px; color: #34d399; }
    </style>
</head>
<body>
    <div class="card">
        <h1>convenienceIA</h1>
        <p>Super-app de descubrimiento, notificaciones de IA y atención automatizada en República Dominicana.</p>
        <div class="status">● Sistema conectado y operativo en la nube</div>
        <button class="btn" onclick="alert('¡GPS de RD activado y listo para buscar opciones cercanas!')">Activar Ubicación / GPS</button>
    </div>
</body>
</html>
